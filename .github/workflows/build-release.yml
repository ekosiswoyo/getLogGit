name: Build & Release

# Build standalone executables for Windows and Linux.
# - On every push/PR: build and upload artifacts (for testing).
# - On pushing a version tag (e.g. v1.0.0): also attach binaries to a GitHub Release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: GitArchiveGenerator-linux
            bin_name: GitArchiveGenerator
          - os: windows-latest
            asset_name: GitArchiveGenerator-windows.exe
            bin_name: GitArchiveGenerator.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow

      - name: Test archive, history, and HTTPS authentication
        run: python -m unittest discover -s tests -v

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python convert_icon.py

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --onefile --windowed --name GitArchiveGenerator
          --add-data "logo.png:."
          git_archive_ui.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --onefile --windowed --name GitArchiveGenerator
          --icon logo.ico
          --add-data "logo.png;."
          --add-data "logo.ico;."
          git_archive_ui.py

      - name: Rename artifact
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv "${{ matrix.bin_name }}" "${{ matrix.asset_name }}"
          else
            mv "${{ matrix.bin_name }}" "${{ matrix.asset_name }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
